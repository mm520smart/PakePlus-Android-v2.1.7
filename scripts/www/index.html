    <style>
        /* 完整样式（已压缩，保证显示正常） */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Serif SC', 'PingFang SC', 'Ma Shan Zheng', 'Segoe UI', sans-serif;
        }
        body {
            background: #3e2c1b;
            background: radial-gradient(circle at 30% 40%, #5a4230, #2a1e15);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .app-wizard {
            max-width: 420px;
            width: 100%;
            background: #fdf3e0;
            background-image: linear-gradient(165deg, #fff7e6, #f3e3cc);
            border-radius: 56px 56px 40px 40px;
            box-shadow: 0 25px 35px -10px #0f0a07;
            border: 2px solid #ad8a67;
            padding: 22px 20px 30px;
            position: relative;
        }
        .step-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fade 0.2s ease;
        }
        .step-panel.active { display: flex; }
        @keyframes fade { 0%{opacity:0.6;} 100%{opacity:1;} }
        .cover-scene {
            text-align: center;
            padding: 10px 10px 20px;
            width: 100%;
        }
        .cover-logo {
            font-size: 4.2rem;
            text-shadow: 6px 8px 0 #bb9a79;
            color: #2f200e;
            margin-bottom: 5px;
            letter-spacing: 16px;
        }
        .cover-title {
            font-size: 2rem;
            font-weight: 800;
            color: #4d2f19;
            background: #e9d2b0;
            display: inline-block;
            padding: 10px 28px;
            border-radius: 100px 20px 100px 20px;
            border: 3px solid #ad7a55;
            box-shadow: inset 0 -3px 0 #6b4f37;
            margin-bottom: 12px;
        }
        .cover-sub {
            color: #674f38;
            border-top: 2px dashed #ba9a7a;

                if (!div) return;
                if (historyRecords.length === 0) {
                    div.innerHTML = '<div style="color:#7a5a3a; text-align:center; padding:12px; background:#f0e0c6; border-radius:30px;">✨ 暂无排盘记录</div>';
                    return;
                }
                let html = '';
                historyRecords.slice(0,10).forEach(rec => {
                    html += `<div class="history-item"><span style="font-size:0.75rem; background:#cbad89; padding:4px 8px; border-radius:40px; color:#1f150d;">${rec.datetime}</span><span class="history-bazi">${rec.bazi}</span></div>`;
                });
                div.innerHTML = html;
            }

            // 生成24节气预览
            function generateTermPreview(year) {
                document.getElementById('previewYear').innerText = year;
                const loading = document.getElementById('termLoading');
                const listDiv = document.getElementById('termPreviewList');
                const errorDiv = document.getElementById('termError');

                loading.style.display = 'block';
                listDiv.style.display = 'none';
                errorDiv.style.display = 'none';

                let terms = window.getYearTerms(year);
                if (!terms || terms.length === 0) {
                    loading.style.display = 'none';
                    errorDiv.style.display = 'block';
                    errorDiv.innerHTML = `❌ 无法获取 ${year} 年节气数据。`;
                    return;
                }

                let html = '';
                terms.forEach(t => {
                    let dateObj = new Date(t.date);
                    let month = dateObj.getMonth() + 1;
                    let day = dateObj.getDate();
                    html += `<div class="term-preview-item"><span class="term-preview-name">${t.term}</span><span class="term-preview-date">${month}月${day}日</span></div>`;
                });
                listDiv.innerHTML = html;
                loading.style.display = 'none';
                listDiv.style.display = 'block';
            }

            // 根据公历日期确定月支
            function getMonthZhi(year, month, day) {
                let terms = window.getYearTerms(year);
                if (!terms) return 2;

                let termDates = [];
                for (let i = 0; i < monthTermIndices.length; i++) {
                    let idx = monthTermIndices[i];
                    let termObj = terms[idx];
                    if (!termObj) continue;
                    let parts = termObj.date.split('-');
                    let m = parseInt(parts[1]);
                    let d = parseInt(parts[2]);
                    termDates.push({ month: m, day: d, zhi: monthZhi[i] });
                }
                if (termDates.length === 0) return 2;

                let curMD = month * 100 + day;
                let termMD = termDates.map(t => t.month * 100 + t.day);
                // 下一年小寒用于边界
                let nextTerms = window.getYearTerms(year + 1);
                if (nextTerms && nextTerms[0]) {
                    let nextXiaohan = nextTerms[0].date.split('-');
                    let nextM = parseInt(nextXiaohan[1]);
                    let nextD = parseInt(nextXiaohan[2]);
                    termMD.push((nextM + 12) * 100 + nextD);
                } else {
                    termMD.push(9999);
                }

                let idx = 0;
                while (idx < termMD.length && curMD >= termMD[idx]) idx++;
                if (idx === 0) return termDates[termDates.length - 1].zhi;
                else return termDates[idx - 1].zhi;
            }

            // 更新节气显示
            function updateSolarTermDisplay() {
                let y = globalData.year;
                let m = globalData.month;
                let d = globalData.day;
                let zhi = getMonthZhi(y, m, d);
                globalData.solarTermMonth = zhi;

                let isTerm = false;
                let termName = '';
                let terms = window.getYearTerms(y);
                if (terms) {
                    for (let i = 0; i < terms.length; i++) {
                        let dateObj = new Date(terms[i].date);
                        if (dateObj.getMonth() + 1 === m && dateObj.getDate() === d) {
                            isTerm = true;
                            termName = terms[i].term;
                            break;
                        }
                    }
                }
                globalData.currentSolarTerm = isTerm ? termName : null;

                let displayDiv = document.getElementById('solarTermDisplay');
                if (displayDiv) {
                    let zhiChar = ground[zhi];
                    if (isTerm) {
                        displayDiv.innerHTML = `🌿 今日节气：<span class="term-name">${termName}</span> · ${zhiChar}月`;
                    } else {
                        displayDiv.innerHTML = `📅 当前月柱：<span class="term-name">${zhiChar}月</span>`;
                    }
                }
            }

            // ---------- 日干支（基准通过已知正确日期计算）----------
            let baseGanZhiIndex = null;

            function daysBetween(d1, d2) { return Math.round((d2 - d1) / 86400000); }

            function calcDayGanzhi(year, month, day) {
                if (baseGanZhiIndex === null) {
                    console.error("基准日干支未初始化");
                    return "甲子";
                }
                let target = new Date(year, month-1, day);
                let base = new Date(1900, 0, 1);
                let days = daysBetween(base, target);
                let idx = (baseGanZhiIndex + days) % 60;
                if (idx < 0) idx += 60;
                return ganzhiCycle[idx];
            }

            function calcYearGanzhi(year) {
                let gan = (year - 4) % 10; if (gan < 0) gan += 10;
                let zhi = (year - 4) % 12; if (zhi < 0) zhi += 12;
                return sky[gan] + ground[zhi];
            }

            // 月干支
            function getMonthGan(yearGanIndex, monthZhiIndex) {
                let group = yearGanIndex % 5;
                let startGan = [2, 4, 6, 8, 0][group];
                let offset = monthZhiIndex - 2;
                if (offset < 0) offset += 12;
                return (startGan + offset) % 10;
            }
            function calcMonthGanzhi(year, monthZhi) {
                let yearGan = (year - 4) % 10; if (yearGan < 0) yearGan += 10;
                let monthGan = getMonthGan(yearGan, monthZhi);
                return sky[monthGan] + ground[monthZhi];
            }

            // 时干支
            function getHourGan(dayGanIndex, hourZhiIndex) {
                let group = dayGanIndex % 5;
                let startGan = [0, 2, 4, 6, 8][group];
                return (startGan + hourZhiIndex) % 10;
            }
            function getHourZhi(hour) {
                if (hour === 23 || hour === 0) return 0;
                return Math.floor((hour + 1) / 2) % 12;
            }
            function calcHourGanzhi(dayGanzhi, hourZhiIdx) {
                let dayGan = dayGanzhi[0];
                let dayGanIdx = sky.indexOf(dayGan);
                let hourGanIdx = getHourGan(dayGanIdx, hourZhiIdx);
                return sky[hourGanIdx] + ground[hourZhiIdx];
            }

            // ---------- 步骤切换 ----------
            function goToStep(step) {
                const steps = document.querySelectorAll('.step-panel');
                steps.forEach(s => s.classList.remove('active'));

                let targetId = 'step' + step;
                let target = document.getElementById(targetId);
                if (target) target.classList.add('active');

                if (step === '2_5') {
                    generateTermPreview(globalData.year);
                }
                if (step === 3) {
                    populateMonthSelect();
                    updateDaySelect();
                    updateDateDisplay();
                }
                if (step === 4) updateTimeDisplay();
            }

            function validateAndGoToStep2_5() {
                let y = parseInt(document.getElementById('yearInput').value);
                if (isNaN(y) || y<1900 || y>2100) { showError('年份请输入1900-2100'); return; }
                globalData.year = y;
                goToStep('2_5');
            }

            function showError(msg) {
                let pop = document.createElement('div');
                pop.innerText = '⚠️ ' + msg;
                pop.style.cssText = 'position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#4a2e1e; color:#ffeac2; padding:20px 30px; border-radius:60px 20px; border:5px solid #c5935e; z-index:1000; font-size:1.2rem;';
                document.body.appendChild(pop);
                setTimeout(()=> pop.remove(), 2500);
            }

            function populateMonthSelect() {
                let sel = document.getElementById('monthSelect');
                if (!sel) return;
                sel.innerHTML = '';
                for (let m=1; m<=12; m++) {
                    let opt = new Option(m+'月', m, false, m===globalData.month);
                    sel.add(opt);
                }
            }
            function daysInMonth(y,m) { return new Date(y,m,0).getDate(); }
            function updateDaySelect() {
                let m = parseInt(document.getElementById('monthSelect').value);
                globalData.month = m;
                let days = daysInMonth(globalData.year, m);
                let daySel = document.getElementById('daySelect');
                daySel.innerHTML = '';
                let curr = Math.min(globalData.day, days);
                for (let d=1; d<=days; d++) {
                    let opt = new Option(d+'日', d, false, d===curr);
                    daySel.add(opt);
                }
                globalData.day = curr;
                updateDateDisplay();
            }
            function updateDateDisplay() {
                let m = parseInt(document.getElementById('monthSelect').value);
                let d = parseInt(document.getElementById('daySelect').value);
                globalData.month = m;
                globalData.day = d;
                document.getElementById('selectedDateDisplay').innerText = `${globalData.year}年${globalData.month}月${globalData.day}日`;
                updateSolarTermDisplay();
            }

            function adjustHour(delta) {
                globalData.hour = (globalData.hour + delta + 24) % 24;
                document.getElementById('hourValue').innerText = globalData.hour;
                updateTimeDisplay();
            }
            function updateTimeDisplay() {
                document.getElementById('hourValue').innerText = globalData.hour;
                document.getElementById('timeDisplay').innerHTML = globalData.hour + '时';
            }

            function completeBazi() {
                let y = globalData.year;
                let m = globalData.month;
                let d = globalData.day;
                let h = globalData.hour;
                updateSolarTermDisplay();

                let yGan = calcYearGanzhi(y);
                let mGan = calcMonthGanzhi(y, globalData.solarTermMonth);
                let dGan = calcDayGanzhi(y, m, d);
                let hZhi = getHourZhi(h);
                let hGan = calcHourGanzhi(dGan, hZhi);

                document.getElementById('baziYear').innerText = yGan;
                document.getElementById('baziMonth').innerText = mGan;
                document.getElementById('baziDay').innerText = dGan;
                document.getElementById('baziHour').innerText = hGan;
                let termInfo = globalData.currentSolarTerm ? `节气:${globalData.currentSolarTerm}` : `月令:${ground[globalData.solarTermMonth]}`;
                document.getElementById('detailTime').innerHTML = `公元${y}年${m}月${d}日 ${h}时 · ${termInfo}`;
                goToStep(5);
            }

            function recordAndGoHome() {
                let y = globalData.year, m = globalData.month, d = globalData.day, h = globalData.hour;
                let yG = calcYearGanzhi(y);
                let mG = calcMonthGanzhi(y, globalData.solarTermMonth);
                let dG = calcDayGanzhi(y, m, d);
                let hZ = getHourZhi(h);
                let hG = calcHourGanzhi(dG, hZ);
                historyRecords.unshift({ datetime: `${y}年${m}月${d}日 ${h}时`, bazi: `${yG} ${mG} ${dG} ${hG}` });
                if (historyRecords.length > 10) historyRecords.pop();
                renderHistory();
                resetAllData();
                goToStep(1);
            }

            function resetAllData() {
                globalData.year = 2026;
                globalData.month = 2;
                globalData.day = 12;
                globalData.hour = 11;
                document.getElementById('yearInput').value = 2026;
                populateMonthSelect();
                updateDaySelect();
                updateDateDisplay();
                updateTimeDisplay();
            }

            // 初始化基准日干支（1900-1-1 为 癸酉，但用已知2026-2-12为丁巳（53）反推）
            function initBaseGanZhi() {
                let baseDate = new Date(1900, 0, 1);
                let knownDate = new Date(2026, 1, 12);
                let days = daysBetween(baseDate, knownDate);
                let knownIndex = 53; // 丁巳
                baseGanZhiIndex = (knownIndex - days % 60 + 60) % 60;
            }

            // 暴露全局函数供 onclick 使用
            window.goToStep = goToStep;
            window.validateAndGoToStep2_5 = validateAndGoToStep2_5;
            window.adjustHour = adjustHour;
            window.completeBazi = completeBazi;
            window.recordAndGoHome = recordAndGoHome;
            window.updateDaySelect = updateDaySelect;
            window.updateDateDisplay = updateDateDisplay;

            // 启动
            initBaseGanZhi();
            resetAllData();
            renderHistory();
        })();
    </script>
</body>
</html>
