<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>自由抽取器 - 双页面版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        /* 主容器 - 手机紧凑 */
        .app-wrapper {
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
        }
        /* 页面容器 */
        .page {
            padding: 18px 16px 20px;
            display: none;
        }
        .page.active {
            display: block;
        }
        /* 底部导航栏 */
        .nav-bar {
            display: flex;
            background: rgba(20, 25, 35, 0.9);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.15);
        }
        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-size: 1rem;
            font-weight: 600;
            color: #ccddee;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn.active {
            color: #F39C12;
            background: rgba(243,156,18,0.1);
            border-bottom: 2px solid #F39C12;
        }
        /* 面板样式 - 更紧凑 */
        .settings-panel, .draw-panel {
            background: rgba(30,35,45,0.7);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #FFE6C7;
            border-left: 4px solid #F39C12;
            padding-left: 10px;
            margin-bottom: 12px;
        }
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        textarea, input {
            width: 100%;
            background: #1e2a32;
            border: 1px solid #4a6272;
            border-radius: 14px;
            padding: 10px 12px;
            color: #f0f0f0;
            font-size: 0.9rem;
            outline: none;
        }
        textarea:focus, input:focus {
            border-color: #F39C12;
            box-shadow: 0 0 0 2px rgba(243,156,18,0.3);
        }
        button {
            background: linear-gradient(135deg, #3a5e6e, #2c4858);
            border: none;
            padding: 8px 16px;
            border-radius: 32px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
            min-height: 40px;
            transition: 0.2s;
        }
        button.primary {
            background: linear-gradient(135deg, #F39C12, #E67E22);
            font-weight: bold;
        }
        button.danger {
            background: #862e2e;
        }
        .items-list {
            background: #141e26;
            border-radius: 16px;
            padding: 10px;
            max-height: 240px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .item-tag {
            background: #2a3b44;
            margin: 4px 6px 4px 0;
            padding: 6px 12px;
            border-radius: 32px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #f5f5f5;
        }
        .del-btn {
            background: none;
            border: none;
            color: #ffaaaa;
            font-size: 1.2rem;
            padding: 0 4px;
            cursor: pointer;
            min-height: auto;
        }
        .result-card {
            background: #1f2e36;
            border-radius: 24px;
            padding: 20px 12px;
            text-align: center;
            margin: 12px 0;
            border: 1px solid #f39c1240;
        }
        .result-content {
            font-size: 1.8rem;
            font-weight: 800;
            color: #FFE5B4;
            word-break: break-word;
            margin: 8px 0;
        }
        .check-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .history-info {
            font-size: 0.75rem;
            background: #00000033;
            padding: 4px 12px;
            border-radius: 20px;
            color: #bbd4e3;
        }
        .empty-hint {
            text-align: center;
            padding: 20px;
            color: #adccdd;
            font-style: italic;
        }
        #drawMessage {
            font-size: 0.75rem;
            text-align: center;
            color: #ffc285;
            min-height: 32px;
        }
        .row-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 8px;
        }
        hr {
            margin: 8px 0;
            border-color: #4a627250;
        }
        /* 手机小屏幕进一步压缩 */
        @media (max-width: 480px) {
            .page {
                padding: 12px;
            }
            .panel-title {
                font-size: 1.1rem;
            }
            .result-content {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- 页面1：设定内容 -->
    <div id="pageSettings" class="page active">
        <div class="settings-panel">
            <div class="panel-title">设定抽取内容</div>
            <div class="flex-col">
                <div>
                    <div style="font-size:0.8rem; margin-bottom: 6px; color:#ffde9e;">单个添加</div>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="newItemInput" placeholder="例如：奶茶 / 散步" style="flex:2;">
                        <button id="addItemBtn" class="primary">添加</button>
                    </div>
                </div>
                <div>
                    <div style="font-size:0.8rem; margin-bottom: 6px; color:#ffde9e;">批量导入 (每行一项)</div>
                    <textarea id="batchItems" rows="2" placeholder="跑步&#10;读书&#10;看电影"></textarea>
                    <div style="display: flex; gap: 8px; margin-top: 8px;">
                        <button id="importBatchBtn" style="flex:1;">导入并替换</button>
                        <button id="loadExampleBtn" style="flex:1;">示例选项</button>
                    </div>
                </div>
            </div>
            <div class="items-list" id="itemsListContainer">
                <div class="empty-hint">暂无选项，请添加</div>
            </div>
            <div class="row-buttons">
                <button id="clearAllItemsBtn" class="danger">清空所有</button>
            </div>
        </div>
    </div>

    <!-- 页面2：随机抽取 -->
    <div id="pageDraw" class="page">
        <div class="draw-panel">
            <div class="panel-title">随机抽取器</div>
            <div class="check-row">
                <label style="display: flex; align-items: center; gap: 6px; color:#FFE0A3;">
                    <input type="checkbox" id="allowRepeatCheckbox" checked> 允许重复
                </label>
                <button id="resetDrawHistoryBtn">重置记录</button>
                <span class="history-info" id="historyStatus">0 / 0</span>
            </div>
            <div class="result-card">
                <div class="result-content" id="drawResult">—</div>
                <button id="drawBtn" class="primary" style="margin-top: 8px; width: 80%;">随机抽取</button>
            </div>
            <div id="drawMessage"></div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="nav-bar">
        <button class="nav-btn active" data-page="settings">设定内容</button>
        <button class="nav-btn" data-page="draw">随机抽取</button>
    </div>
</div>

<script>
    // --- 核心数据 ---
    let items = [];            // { id, text }
    let drawnIds = new Set();
    let nextId = 1;

    // DOM 元素
    const pageSettings = document.getElementById('pageSettings');
    const pageDraw = document.getElementById('pageDraw');
    const navBtns = document.querySelectorAll('.nav-btn');
    const itemsContainer = document.getElementById('itemsListContainer');
    const newItemInput = document.getElementById('newItemInput');
    const addBtn = document.getElementById('addItemBtn');
    const clearAllBtn = document.getElementById('clearAllItemsBtn');
    const batchTextarea = document.getElementById('batchItems');
    const importBtn = document.getElementById('importBatchBtn');
    const loadExampleBtn = document.getElementById('loadExampleBtn');
    const allowRepeatCheck = document.getElementById('allowRepeatCheckbox');
    const resetHistoryBtn = document.getElementById('resetDrawHistoryBtn');
    const drawBtn = document.getElementById('drawBtn');
    const drawResultSpan = document.getElementById('drawResult');
    const historyStatusSpan = document.getElementById('historyStatus');
    const drawMessageDiv = document.getElementById('drawMessage');

    // --- 本地存储 ---
    function saveToLocalStorage() {
        const data = {
            items: items,
            drawnIds: Array.from(drawnIds),
            nextId: nextId
        };
        localStorage.setItem('randomPickerData', JSON.stringify(data));
    }

    function loadFromLocalStorage() {
        const raw = localStorage.getItem('randomPickerData');
        if (!raw) return false;
        try {
            const data = JSON.parse(raw);
            if (data.items && Array.isArray(data.items)) {
                items = data.items;
                nextId = data.nextId || (items.length ? Math.max(...items.map(i=>i.id), 0)+1 : 1);
                drawnIds = new Set(data.drawnIds || []);
                return true;
            }
        } catch(e) {}
        return false;
    }

    // --- UI 渲染 ---
    function renderItemsList() {
        if (!itemsContainer) return;
        if (items.length === 0) {
            itemsContainer.innerHTML = '<div class="empty-hint">暂无选项，请添加内容或批量导入</div>';
            updateHistoryInfo();
            return;
        }
        const container = document.createElement('div');
        container.style.display = 'flex';
        container.style.flexWrap = 'wrap';
        container.style.gap = '6px';
        items.forEach(item => {
            const tag = document.createElement('div');
            tag.className = 'item-tag';
            const textSpan = document.createElement('span');
            textSpan.textContent = item.text;
            const delBtn = document.createElement('button');
            delBtn.textContent = 'x';
            delBtn.className = 'del-btn';
            delBtn.setAttribute('data-id', item.id);
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteItemById(item.id);
            });
            tag.appendChild(textSpan);
            tag.appendChild(delBtn);
            container.appendChild(tag);
        });
        itemsContainer.innerHTML = '';
        itemsContainer.appendChild(container);
        updateHistoryInfo();
    }

    function deleteItemById(id) {
        const itemExists = items.some(it => it.id === id);
        if (!itemExists) return;
        items = items.filter(it => it.id !== id);
        if (drawnIds.has(id)) drawnIds.delete(id);
        if (items.length === 0) drawnIds.clear();
        saveToLocalStorage();
        renderItemsList();
        // 如果当前抽取结果显示的是被删项，清空结果
        const currentDisplay = drawResultSpan.innerText;
        const deletedText = items.find(it=>it.id===id)?.text;
        if (deletedText && currentDisplay === deletedText) {
            drawResultSpan.innerText = '—';
            drawMessageDiv.innerHTML = '';
        }
        updateHistoryInfo();
    }

    function addItem(text) {
        if (!text || text.trim() === '') return false;
        const trimmed = text.trim();
        if (items.some(item => item.text === trimmed)) {
            drawMessageDiv.innerHTML = '警告：选项已存在';
            return false;
        }
        items.push({ id: nextId++, text: trimmed });
        saveToLocalStorage();
        renderItemsList();
        drawMessageDiv.innerHTML = '已添加: ' + escapeHtml(trimmed);
        setTimeout(() => { if(drawMessageDiv.innerHTML.includes('已添加')) drawMessageDiv.innerHTML = ''; }, 1200);
        return true;
    }

    function clearAllItems() {
        if (items.length === 0) return;
        if (confirm('确定清空所有选项吗？')) {
            items = [];
            drawnIds.clear();
            nextId = 1;
            saveToLocalStorage();
            renderItemsList();
            drawResultSpan.innerText = '—';
            drawMessageDiv.innerHTML = '所有选项已清空';
            setTimeout(() => drawMessageDiv.innerHTML = '', 1200);
        }
    }

    function importBatchReplace(textareaValue) {
        const lines = textareaValue.split(/\r?\n/);
        const newItems = [];
        for (let line of lines) {
            line = line.trim();
            if (line === '') continue;
            if (!newItems.some(i => i.text === line)) {
                newItems.push({ id: nextId++, text: line });
            }
        }
        if (newItems.length === 0) {
            drawMessageDiv.innerHTML = '无有效内容，导入失败';
            return;
        }
        items = newItems;
        drawnIds.clear();
        saveToLocalStorage();
        renderItemsList();
        drawResultSpan.innerText = '—';
        drawMessageDiv.innerHTML = '导入成功，共 ' + items.length + ' 项';
        setTimeout(() => drawMessageDiv.innerHTML = '', 1800);
    }

    function loadExample() {
        const exampleList = ["跑步", "读书", "看电影", "学编程", "听音乐"];
        const newItems = [];
        let newId = 1;
        for (let txt of exampleList) {
            newItems.push({ id: newId++, text: txt });
        }
        items = newItems;
        nextId = newId;
        drawnIds.clear();
        saveToLocalStorage();
        renderItemsList();
        drawResultSpan.innerText = '—';
        drawMessageDiv.innerHTML = '已加载示例 (5项)';
        setTimeout(() => drawMessageDiv.innerHTML = '', 1200);
    }

    function resetDrawHistory() {
        drawnIds.clear();
        saveToLocalStorage();
        updateHistoryInfo();
        drawMessageDiv.innerHTML = '抽取记录已重置';
        setTimeout(() => drawMessageDiv.innerHTML = '', 1200);
    }

    function updateHistoryInfo() {
        const total = items.length;
        let drawnCount = 0;
        if (!allowRepeatCheck.checked) {
            let valid = 0;
            for (let id of drawnIds) {
                if (items.some(it => it.id === id)) valid++;
            }
            drawnCount = valid;
        }
        historyStatusSpan.innerText = `${drawnCount} / ${total}`;
        if (!allowRepeatCheck.checked && drawnCount === total && total > 0) {
            drawMessageDiv.innerHTML = '所有选项已抽完，请开启重复或重置记录';
        }
    }

    function performDraw() {
        if (items.length === 0) {
            drawMessageDiv.innerHTML = '没有可抽取的选项，请先添加内容';
            drawResultSpan.innerText = '—';
            return;
        }
        const allowRepeat = allowRepeatCheck.checked;
        let available = [];
        if (!allowRepeat) {
            available = items.filter(item => !drawnIds.has(item.id));
            if (available.length === 0) {
                drawMessageDiv.innerHTML = '已无未抽选项，请开启重复或重置记录';
                return;
            }
        } else {
            available = [...items];
        }
        const randomIndex = Math.floor(Math.random() * available.length);
        const selected = available[randomIndex];
        drawResultSpan.innerText = selected.text;
        if (!allowRepeat) {
            drawnIds.add(selected.id);
            saveToLocalStorage();
        }
        updateHistoryInfo();
        drawMessageDiv.innerHTML = allowRepeat ? '抽取完成' : '已标记，不再重复';
        setTimeout(() => {
            if (drawMessageDiv.innerHTML === '抽取完成' || drawMessageDiv.innerHTML === '已标记，不再重复')
                drawMessageDiv.innerHTML = '';
        }, 1000);
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 页面切换
    function switchPage(pageId) {
        if (pageId === 'settings') {
            pageSettings.classList.add('active');
            pageDraw.classList.remove('active');
        } else {
            pageDraw.classList.add('active');
            pageSettings.classList.remove('active');
        }
        navBtns.forEach(btn => {
            if (btn.getAttribute('data-page') === pageId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    // --- 事件绑定 ---
    addBtn.addEventListener('click', () => {
        const val = newItemInput.value;
        if (addItem(val)) newItemInput.value = '';
        newItemInput.focus();
    });
    newItemInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const val = newItemInput.value;
            if (addItem(val)) newItemInput.value = '';
        }
    });
    clearAllBtn.addEventListener('click', clearAllItems);
    importBtn.addEventListener('click', () => {
        const raw = batchTextarea.value;
        if (!raw.trim()) {
            drawMessageDiv.innerHTML = '请填写内容，每行一项';
            return;
        }
        importBatchReplace(raw);
        batchTextarea.value = '';
    });
    loadExampleBtn.addEventListener('click', loadExample);
    resetHistoryBtn.addEventListener('click', resetDrawHistory);
    drawBtn.addEventListener('click', performDraw);
    allowRepeatCheck.addEventListener('change', () => {
        updateHistoryInfo();
        if (!allowRepeatCheck.checked) {
            const validIds = new Set(items.map(i => i.id));
            for (let id of drawnIds) {
                if (!validIds.has(id)) drawnIds.delete(id);
            }
            saveToLocalStorage();
            updateHistoryInfo();
        }
    });
    navBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const page = btn.getAttribute('data-page');
            switchPage(page);
        });
    });

    // --- 初始化 ---
    if (!loadFromLocalStorage()) {
        items = [];
        nextId = 1;
        drawnIds.clear();
    }
    renderItemsList();
    updateHistoryInfo();
    // 默认显示设定页，抽取页结果同步
    if (items.length === 0) drawResultSpan.innerText = '—';
</script>
</body>
</html>
